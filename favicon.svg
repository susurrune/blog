<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C96F46"/>
      <stop offset="100%" stop-color="#A85A36"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 雨 — bold geometric character -->
  <!-- Top horizontal stroke -->
  <rect x="12" y="12" width="40" height="6" rx="3" fill="#FDF8F3"/>
  <!-- Vertical strokes (the "door" part) -->
  <rect x="16" y="20" width="5" height="16" rx="2.5" fill="#FDF8F3"/>
  <rect x="43" y="20" width="5" height="16" rx="2.5" fill="#FDF8F3"/>
  <!-- Middle horizontal -->
  <rect x="16" y="28" width="32" height="5" rx="2.5" fill="#FDF8F3"/>
  <!-- Four raindrop dots — larger and bolder -->
  <rect x="17" y="37" width="6" height="6" rx="3" fill="#FDF8F3"/>
  <rect x="26" y="42" width="6" height="6" rx="3" fill="#FDF8F3"/>
  <rect x="35" y="37" width="6" height="6" rx="3" fill="#FDF8F3"/>
  <rect x="44" y="42" width="6" height="6" rx="3" fill="#FDF8F3"/>
  <!-- Two more falling dots -->
  <rect x="21" y="50" width="5" height="5" rx="2.5" fill="#FDF8F3" opacity="0.85"/>
  <rect x="38" y="50" width="5" height="5" rx="2.5" fill="#FDF8F3" opacity="0.85"/>
</svg>
