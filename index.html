<!--
  Design Direction: Terracotta Sun / 暖阳杂志
  - 主色调：陶土橙 #C96F46 + 鼠尾草绿 #7B8D6B — 温暖的在地感，不冰冷不浮夸
  - 底色：暖白 #FDF8F3，像有温度的纸张
  - 字体：Fraunces（衬线展示，有雕塑感） + 霞鹜文楷（有手写温度的正文）
  - 核心：大字号、宽留白、低信息密度、阅读舒适
  - 氛围：像在靠窗的咖啡馆翻一本独立杂志
-->

<style>
/* ========================================
   Design: Terracotta Sun / 暖阳杂志
   v3.0 — 大排版 · 暖色调 · 呼吸感
   ======================================== */

:root {
  --paper: #FDF8F3;
  --surface: #FFFFFF;
  --ink: #2B1F1A;
  --ink-soft: #7A6B60;
  --ink-faint: #B0A296;
  --accent: #C96F46;
  --accent-deep: #A85A36;
  --accent-glow: #F5E4D8;
  --sage: #7B8D6B;
  --sage-soft: #E2E8D8;
  --line: #E8DDD0;
  --line-bold: #D4C7B8;
  --font-display: 'Fraunces', 'Georgia', 'Times New Roman', serif;
  --font-body: 'LXGW WenKai', 'KaiTi', 'STKaiti', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  --radius-sm: 3px;
}

[data-theme="dark"] {
  --paper: #181410;
  --surface: #221E18;
  --ink: #E8E0D6;
  --ink-soft: #A09688;
  --ink-faint: #6B6258;
  --accent: #E8916E;
  --accent-deep: #C96F46;
  --accent-glow: #2D1E16;
  --sage: #8DA87B;
  --sage-soft: #1E2418;
  --line: #322B24;
  --line-bold: #4A4138;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.85;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:18px;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E"),
    radial-gradient(circle at 10% 10%, rgba(201,111,70,.04) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(123,141,107,.05) 0%, transparent 50%);
}
a{color:var(--accent);text-decoration:none;transition:color .25s}
a:hover{color:var(--accent-deep)}
::selection{background:var(--accent-glow);color:var(--ink)}

/* ===== 阅读进度条 ===== */
#readingProgress{
  position:fixed;top:0;left:0;width:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--sage));
  z-index:999;transition:width .1s linear;
  opacity:0;pointer-events:none
}
#readingProgress.visible{opacity:1}

/* ===== 容器 ===== */
.container{max-width:1600px;margin:0 auto;padding:0 40px}

/* ===== 头部 ===== */
.site-header{
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
  transition:box-shadow .3s
}
.site-header.scrolled{
  box-shadow:0 1px 0 var(--line-bold)
}
.site-header .container{
  display:flex;align-items:center;justify-content:space-between;height:64px
}
.logo{
  font-family:var(--font-display);font-size:22px;font-weight:700;
  color:var(--ink)!important;letter-spacing:-.03em;
  display:flex;align-items:center;gap:12px
}
.logo-svg{flex-shrink:0;margin-top:-2px;color:var(--accent)}

.nav{display:flex;align-items:center;gap:2px}
.nav a{
  font-size:12.5px;font-weight:600;color:var(--ink-soft);
  padding:8px 18px;letter-spacing:.05em;text-transform:uppercase;
  border-radius:var(--radius-sm);transition:all .2s;position:relative;
  font-family:var(--font-display)
}
.nav a:hover,.nav a.active{color:var(--ink);background:rgba(0,0,0,.04)}
.nav a.active::after{
  content:'';position:absolute;bottom:2px;left:18px;right:18px;
  height:2px;background:var(--accent);border-radius:1px
}
[data-theme="dark"] .nav a:hover,[data-theme="dark"] .nav a.active{background:rgba(255,255,255,.06)}

.theme-btn{
  background:none;border:1px solid var(--line);width:38px;height:38px;
  border-radius:50%;cursor:pointer;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  margin-left:8px;transition:all .3s;flex-shrink:0
}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:rotate(25deg)}

/* ===== Hero ===== */
.hero{padding:96px 0 56px;position:relative}
.hero-inner{position:relative}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(48px,8vw,88px);
  font-weight:700;letter-spacing:-.04em;line-height:1.02;margin-bottom:8px
}
.hero h1 .char-accent{
  color:var(--accent);
  font-style:italic;
  text-decoration:underline;
  text-decoration-color:var(--sage);
  text-decoration-thickness:4px;
  text-underline-offset:8px
}
.hero-brush{display:block;margin:12px 0 16px -4px;opacity:.7}
.hero .sub{
  font-size:clamp(17px,2vw,20px);
  color:var(--ink-soft);line-height:1.65;max-width:560px;
  letter-spacing:.01em
}
.hero-seal{
  position:absolute;top:-12px;right:4px;
  width:64px;height:64px;
  background:var(--accent-glow);
  border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  color:var(--accent-deep);font-family:var(--font-display);
  font-size:7px;font-weight:700;letter-spacing:.1em;line-height:1.2;
  text-transform:uppercase;
  transform:rotate(8deg);opacity:.9;transition:all .4s
}
.hero-seal:hover{transform:rotate(-2deg) scale(1.06);background:var(--accent);color:white}
.hero-seal .seal-big{font-size:16px;letter-spacing:0;font-weight:800}

/* ===== 工具栏 ===== */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:44px;flex-wrap:wrap;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--line)
}
.filter-group{display:flex;gap:0;flex-wrap:wrap}
.filter-btn{
  font-family:var(--font-body);font-size:13px;font-weight:500;
  padding:7px 18px;border:1px solid var(--line);
  background:transparent;color:var(--ink-soft);
  cursor:pointer;transition:all .2s
}
.filter-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.filter-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.filter-btn:not(:last-child){border-right:0}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);z-index:1;position:relative}
.filter-btn.active{
  background:var(--accent);color:white;border-color:var(--accent);z-index:1;position:relative
}
.search-box{
  display:flex;align-items:center;
  border:1px solid var(--line);padding:0 12px;
  transition:border-color .25s;border-radius:var(--radius-sm);
  background:var(--surface)
}
.search-box:focus-within{border-color:var(--accent)}
.search-box svg{flex-shrink:0;opacity:.35;color:var(--ink-soft)}
.search-box input{
  font-family:var(--font-body);font-size:14px;
  padding:8px 8px;border:none;background:transparent;
  color:var(--ink);outline:none;width:160px
}
.search-box input::placeholder{color:var(--ink-faint)}

/* ===== 文章列表 ===== */
.post-list{padding-bottom:96px}
.post-item{
  display:grid;grid-template-columns:100px 1fr;gap:32px;
  padding:40px 0 40px 24px;
  border-bottom:1px solid var(--line);
  cursor:pointer;transition:all .35s;position:relative;
  color:inherit;text-decoration:none
}
.post-item:first-child{padding-top:0}
.post-item::before{
  content:'';position:absolute;left:0;top:25%;bottom:25%;
  width:3px;background:var(--line-bold);
  transition:all .4s cubic-bezier(.22,1,.36,1);
  opacity:0;border-radius:2px
}
.post-item:hover::before{top:6%;bottom:6%;opacity:1;background:var(--accent)}
.post-item:first-child::before{top:8%}

.post-date{text-align:right;padding-top:4px}
.post-date .day{
  display:block;font-family:var(--font-display);
  font-size:36px;font-weight:700;color:var(--accent);
  line-height:1;margin-bottom:2px;transition:color .25s
}
.post-date .month{
  display:block;font-size:12px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-faint);
  font-family:var(--font-display)
}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.post-tag{
  font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-faint);
  background:var(--paper);
  padding:2px 10px;
  border:1px solid var(--line);
  border-radius:2px;transition:all .25s
}
.post-item:hover .post-tag{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.post-title{
  font-family:var(--font-display);
  font-size:clamp(22px,2.8vw,30px);font-weight:600;
  line-height:1.25;margin-bottom:8px;letter-spacing:-.02em;
  transition:color .25s
}
.post-item:hover .post-title{color:var(--accent)}
.post-excerpt{
  font-size:16px;color:var(--ink-soft);
  line-height:1.7;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.post-meta-row{
  display:flex;align-items:center;justify-content:space-between;margin-top:12px
}
.read-indicator{
  font-size:12px;font-weight:600;
  color:var(--accent);letter-spacing:.1em;
  text-transform:uppercase;
  opacity:0;
  transform:translateX(-8px);
  transition:all .35s cubic-bezier(.22,1,.36,1)
}
.post-item:hover .read-indicator{opacity:1;transform:translateX(0)}
.reading-time{
  font-size:12px;color:var(--ink-faint);
  font-family:var(--font-display);letter-spacing:.04em
}

/* ===== 空状态 ===== */
.empty-state{
  grid-column:1/-1;text-align:center;padding:100px 20px;color:var(--ink-soft)
}
.empty-state .seal-mock{
  width:56px;height:56px;margin:0 auto 20px;
  border:2px solid var(--line);position:relative;
  display:flex;align-items:center;justify-content:center;transform:rotate(4deg);
  background:var(--paper)
}
.empty-state .seal-mock::after{
  content:'';position:absolute;inset:6px;border:1px solid var(--line)
}
.empty-state h3{font-family:var(--font-display);font-size:22px;margin-bottom:6px;color:var(--ink)}

.post-count{
  text-align:right;font-size:13px;
  font-family:var(--font-display);color:var(--ink-faint);
  padding:8px 0 0;letter-spacing:.02em
}

/* ===== 回到顶部 ===== */
#backToTop{
  position:fixed;bottom:32px;right:32px;
  width:48px;height:48px;border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;z-index:90;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(20px) scale(.9);
  transition:all .4s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.06)
}
#backToTop.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#backToTop:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}
#backToTop svg{position:absolute}
#backToTop circle{transition:stroke-dashoffset .1s linear}
[data-theme="dark"] #backToTop{box-shadow:0 4px 20px rgba(0,0,0,.3)}

/* ===== 模态框 ===== */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(43,31,26,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px
}
.modal-overlay.open{display:flex}
.modal-scrim{position:absolute;inset:0}
.modal-content{
  position:relative;
  background:var(--surface);
  max-width:920px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  padding:44px 48px;
  border:1px solid var(--line);
  box-shadow:0 32px 100px rgba(0,0,0,.12);
  animation:modalIn .45s cubic-bezier(.16,1,.3,1) both
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(28px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-content.modal-out{
  animation:modalOut .25s cubic-bezier(.55,0,.1,1) both
}
@keyframes modalOut{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(16px) scale(.97)}
}

.modal-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;width:38px;height:38px;
  cursor:pointer;color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:all .2s
}
.modal-close:hover{color:var(--ink);background:rgba(0,0,0,.04);color:var(--accent)}
[data-theme="dark"] .modal-close:hover{background:rgba(255,255,255,.06)}

/* ===== 文章详情 ===== */
.detail-seal{
  display:inline-flex;align-items:center;gap:10px;margin-bottom:16px
}
.detail-seal .seal-stamp{
  width:32px;height:32px;border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-family:var(--font-display);
  font-size:6px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;transform:rotate(4deg);flex-shrink:0;
  background:var(--accent-glow)
}
.detail-seal .seal-text{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-faint);font-family:var(--font-display)
}
.detail-title{
  font-family:var(--font-display);
  font-size:clamp(26px,4vw,36px);
  font-weight:700;line-height:1.15;margin-bottom:8px;letter-spacing:-.02em
}
.detail-meta{
  font-size:13px;color:var(--ink-faint);
  margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)
}

/* ----- 文章目录 (TOC) ----- */
.detail-toc-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-soft);cursor:pointer;padding:8px 0;
  border:none;background:none;font-family:var(--font-display);
  transition:color .2s;margin-bottom:18px
}
.detail-toc-btn:hover{color:var(--ink)}
.detail-toc-btn svg{transition:transform .3s;color:var(--accent)}
.detail-toc-btn.open svg{transform:rotate(90deg)}

.detail-toc{
  margin-bottom:24px;padding:16px 20px;
  border-left:3px solid var(--accent);
  background:var(--paper);
  display:none;font-size:14px
}
.detail-toc.open{display:block}
.detail-toc .toc-title{
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-faint);margin-bottom:10px;
  font-weight:600;font-family:var(--font-display)
}
.detail-toc a{
  display:block;padding:4px 0;color:var(--ink-soft);
  transition:color .2s;border:none;font-size:14px
}
.detail-toc a:hover{color:var(--accent)}
.detail-toc .toc-h2{padding-left:0;font-weight:500}
.detail-toc .toc-h3{padding-left:20px;font-size:13px;color:var(--ink-faint)}

/* ----- 正文排版 ----- */
.detail-body{
  font-size:18px;line-height:1.9;color:var(--ink)
}
.detail-body h2{
  font-family:var(--font-display);font-size:24px;font-weight:600;
  margin:40px 0 12px;letter-spacing:-.01em;
  padding-bottom:6px;border-bottom:1px solid var(--line)
}
.detail-body h3{
  font-size:18px;font-weight:600;margin:28px 0 10px;
  color:var(--accent-deep)
}
.detail-body p{margin-bottom:18px}
.detail-body ul,.detail-body ol{margin:0 0 18px 24px}
.detail-body li{margin-bottom:4px}

/* 首字下沉 */
.detail-body > p:first-of-type::first-letter{
  font-family:var(--font-display);
  font-size:3.6em;font-weight:700;
  float:left;line-height:.8;margin-right:12px;
  margin-top:3px;color:var(--accent);
  letter-spacing:-.03em
}

.detail-body code{
  font-family:var(--font-mono);font-size:15px;
  background:var(--line);padding:2px 8px;border-radius:var(--radius-sm)
}
[data-theme="dark"] .detail-body code{background:#2D2720}

.detail-body pre{
  background:#1A1613;color:#E8E0D6;
  padding:24px 28px;overflow-x:auto;
  margin:24px 0;font-size:15px;line-height:1.7;
  border-left:4px solid var(--accent)
}
.detail-body pre code{
  background:none;padding:0;color:inherit;font-size:inherit
}

/* Prism 覆盖 */
.detail-body pre[class*="language-"]{
  margin:24px 0;border-left:4px solid var(--accent);
  border-radius:0
}
.detail-body :not(pre) > code[class*="language-"],
.detail-body pre[class*="language-"]{
  background:#1A1613
}

.detail-body blockquote{
  border-left:3px solid var(--sage);
  padding:8px 20px;margin:24px 0;
  color:var(--ink-soft);font-style:italic;position:relative;
  background:var(--paper)
}
.detail-body blockquote::before{
  content:'"';font-family:var(--font-display);
  font-size:56px;color:var(--accent);opacity:.2;
  position:absolute;top:-20px;left:-8px;line-height:1;pointer-events:none
}

/* 对比网格 */
.detail-body .comparison-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;
  margin:24px 0
}
.detail-body .comparison-col{
  padding:20px;border:1px solid var(--line);
  background:var(--paper);
  transition:border-color .25s
}
.detail-body .comparison-col:hover{border-color:var(--accent)}
.detail-body .comparison-col h3{
  font-family:var(--font-display);font-size:16px;font-weight:600;
  margin:0 0 10px;padding:0 0 8px;
  border-bottom:1px solid var(--line);color:var(--ink)
}
.detail-body .comparison-col p{font-size:15px;margin:0;color:var(--ink-soft)}

/* 文章内表格 */
.detail-body table{
  width:100%;border-collapse:collapse;
  margin:24px 0;font-size:15px;line-height:1.6
}
.detail-body th,.detail-body td{
  padding:10px 14px;border:1px solid var(--line);
  text-align:left;vertical-align:top
}
.detail-body th{
  background:var(--paper);font-weight:600;
  font-family:var(--font-display);font-size:13px;
  text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft)
}
.detail-body td{color:var(--ink-soft)}
[data-theme="dark"] .detail-body th{background:#28231C}
.detail-body tr:hover td{background:var(--paper)}

/* 文章图片 */
.detail-body img{
  max-width:100%;height:auto;display:block;margin:28px auto;
  border:1px solid var(--line);transition:filter .3s
}

@media(max-width:560px){
  .detail-body .comparison-grid{grid-template-columns:1fr}
  .detail-body table{font-size:13px}
  .detail-body th,.detail-body td{padding:6px 10px}
}

/* ===== 文章导航 ===== */
.detail-nav{
  display:flex;justify-content:space-between;
  margin-top:44px;padding-top:24px;border-top:1px solid var(--line);gap:20px
}
.detail-nav a{
  font-size:14px;font-weight:600;color:var(--ink-soft);
  transition:color .2s;max-width:50%
}
.detail-nav a:hover{color:var(--ink)}
.detail-nav .nav-next{text-align:right;margin-left:auto}
.detail-nav .nav-prev{text-align:left}

/* ===== 分享按钮 ===== */
.share-bar{
  display:flex;align-items:center;gap:8px;
  margin-top:32px;padding-top:20px;border-top:1px solid var(--line)
}
.share-bar .share-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-faint);font-family:var(--font-display);margin-right:4px
}
.share-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;padding:6px 14px;border:1px solid var(--line);
  color:var(--ink-soft);background:var(--surface);
  cursor:pointer;border-radius:var(--radius-sm);
  transition:all .2s;font-family:var(--font-body)
}
.share-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Giscus 评论区 ===== */
.comments-section{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}

/* ===== 页脚 ===== */
.site-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:32px 0;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-faint);flex-wrap:wrap;gap:8px
}

/* ===== 入场动画 ===== */
.hero-anim{animation:fadeUp .85s cubic-bezier(.16,1,.3,1) both}
.hero-anim-delay{animation:fadeUp .85s cubic-bezier(.16,1,.3,1) .15s both}
.hero-anim-delay-2{animation:fadeUp .75s cubic-bezier(.16,1,.3,1) .25s both}
.toolbar-anim{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

.post-item{
  opacity:0;transform:translateY(24px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)
}
.post-item.visible{opacity:1;transform:translateY(0)}

/* ===== 滚动条 ===== */
.modal-content::-webkit-scrollbar{width:6px}
.modal-content::-webkit-scrollbar-track{background:transparent}
.modal-content::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.modal-content::-webkit-scrollbar-thumb:hover{background:var(--line-bold)}

  .post-date{text-align:left;display:flex;align-items:baseline;gap:8px}

  .detail-body{font-size:16px}

  .detail-nav{flex-direction:column;align-items:flex-start;gap:10px}

  .site-footer{flex-direction:column;text-align:center}
  #backToTop{bottom:20px;right:20px;width:42px;height:42px}
}
</style>

<script src="posts/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

<script>
/* ===== 应用 ===== */
const state = {
  currentTag: null,
  searchQuery: '',
  filteredPosts: [...posts],
  currentIndex: -1,
  currentSlug: null,
};

/* ---- 路由 ---- */
function getRoute() {
  const hash = window.location.hash;
  const m = hash.match(/^#\/post\/(.+)/);
  return m ? { type: 'post', slug: m[1] } : { type: 'home' };
}

function routeTo(slug) {
  if (slug) {
    window.location.hash = '#/post/' + slug;
  } else {
    history.replaceState(null, '', window.location.pathname);
  }
}

function handleRoute() {
  const route = getRoute();
  if (route.type === 'post') {
    const post = posts.find(p => p.slug === route.slug);
    if (post) {
      const idx = posts.indexOf(post);
      state.filteredPosts = [...posts];
      state.currentTag = null;
      state.searchQuery = '';
      searchInput.value = '';
      renderTags();
      updateNavActive();
      openPostBySlug(route.slug);
    }
  }
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ---- SEO meta 更新 ---- */
function updateMeta(prop, val) {
  let el = document.querySelector(`meta[property="${prop}"], meta[name="${prop}"]`);
  if (el) { el.content = val; return; }
  el = document.createElement('meta');
  if (prop.startsWith('og:')) el.setAttribute('property', prop);
  else el.setAttribute('name', prop);
  el.content = val;
  document.head.appendChild(el);
}

const postList = $('#postList');
const filterGroup = $('#filterGroup');
const searchInput = $('#searchInput');
const modalOverlay = $('#modalOverlay');
const modalContent = $('#modalContent');
const modalBody = $('#modalBody');
const modalClose = $('#modalClose');
const modalScrim = $('#modalScrim');
const themeBtn = $('#themeBtn');
const postCount = $('#postCount');
const siteHeader = $('#siteHeader');
const progressBar = $('#readingProgress');
const backToTop = $('#backToTop');
const topProgress = $('#topProgress');

/* ---- 解析日期 ---- */
function parseDate(str) {
  const d = new Date(str);
  const m = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  return {
    day: d.getDate(),
    month: m[d.getMonth()],
    full: `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`,
  };
}

/* ---- 渲染标签 ---- */
function renderTags() {
  const set = new Set();
  posts.forEach(p => p.tags.forEach(t => set.add(t)));
  const all = Array.from(set).sort();
  filterGroup.innerHTML = [
    `<button class="filter-btn ${!state.currentTag ? 'active' : ''}" data-tag="">全部</button>`,
    ...all.map(t =>
      `<button class="filter-btn ${state.currentTag === t ? 'active' : ''}" data-tag="${t}">${t}</button>`
    ),
  ].join('');
  filterGroup.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentTag = btn.dataset.tag || null;
      state.searchQuery = '';
      searchInput.value = '';
      renderTags();
      filterPosts();
      updateNavActive();
    });
  });
}

function updateNavActive() {
  const navLinks = document.querySelectorAll('.nav a[data-tag], .nav a[href="./"]');
  navLinks.forEach(a => a.classList.remove('active'));
  if (!state.currentTag) {
    document.querySelector('.nav a[href="./"]')?.classList.add('active');
  } else {
    document.querySelector(`.nav a[data-tag="${state.currentTag}"]`)?.classList.add('active');
  }
}

/* ---- 筛选 ---- */
function filterPosts() {
  let r = [...posts];
  if (state.currentTag) r = r.filter(p => p.tags.includes(state.currentTag));
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.trim().toLowerCase();
    r = r.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.excerpt.toLowerCase().includes(q) ||
      p.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  state.filteredPosts = r;
  renderPosts();
}

/* ---- 渲染文章列表 ---- */
function renderPosts() {
  const list = state.filteredPosts;
  postCount.textContent = list.length;
  if (list.length === 0) {
    postList.innerHTML = `
      <div class="empty-state">
        <div class="seal-mock"></div>
        <h3>没有找到文章</h3>
        <p>试试其他关键词吧</p>
      </div>`;
    return;
  }
  postList.innerHTML = list.map((post, i) => {
    const d = parseDate(post.date);
    const rt = post.readingTime || 1;
    return `
      <a class="post-item" href="#/post/${post.slug}" data-slug="${post.slug}" data-index="${i}">
        <div class="post-date">
          <span class="day">${d.day}</span>
          <span class="month">${d.month}</span>
        </div>
        <div>
          <div class="post-tags">${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}</div>
          <h2 class="post-title">${post.title}</h2>
          <p class="post-excerpt">${post.excerpt}</p>
          <div class="post-meta-row">
            <span class="read-indicator">阅读 &rarr;</span>
            <span class="reading-time">${rt} 分钟</span>
          </div>
        </div>
      </a>`;
  }).join('');
  // 点击拦截：用 hash 路由，不刷新页面。中键/右键新标签页原生支持。
  postList.querySelectorAll('.post-item').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      state.currentIndex = parseInt(el.dataset.index);
      const post = posts.find(p => p.slug === el.dataset.slug);
      if (post) openPostBySlug(post.slug);
    });
  });
  observePosts();
}

/* ---- 滚动观察 ---- */
let observer = null;
function observePosts() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: .1, rootMargin: '0px 0px -40px 0px' });
  postList.querySelectorAll('.post-item').forEach(el => observer.observe(el));
}

/* ---- 生成目录 ---- */
function buildTOC(container) {
  const headings = container.querySelectorAll('h2, h3');
  if (headings.length < 2) return '';
  let toc = '<button class="detail-toc-btn" id="tocToggle">'
    + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>'
    + '目录</button>'
    + '<div class="detail-toc" id="tocPanel">'
    + '<div class="toc-title">CONTENTS</div>';
  headings.forEach(h => {
    const id = 'h-' + Math.random().toString(36).slice(2, 8);
    h.id = id;
    const cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
    toc += `<a href="#${id}" class="${cls}">${h.textContent}</a>`;
  });
  toc += '</div>';
  return toc;
}

/* ---- 打开文章 ---- */
function openPostBySlug(slug) {
  const post = posts.find(p => p.slug === slug);
  if (!post) return;

  // 更新 hash 路由和页面标题
  if (state.currentSlug !== slug) {
    state.currentSlug = slug;
    routeTo(slug);
  }
  document.title = post.title + ' — 雨落';

  // 动态更新 SEO meta 标签（社交分享用）
  const postUrl = 'https://susurrune.github.io/blog/#/post/' + slug;
  updateMeta('og:title', post.title);
  updateMeta('og:description', post.excerpt);
  updateMeta('og:url', postUrl);
  updateMeta('og:type', 'article');
  updateMeta('twitter:title', post.title);
  updateMeta('twitter:description', post.excerpt);
  updateMeta('description', post.excerpt);
  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.href = postUrl;

  const d = parseDate(post.date);
  const idx = posts.indexOf(post);
  state.currentIndex = idx;
  const list = state.filteredPosts.length > 0 ? state.filteredPosts : posts;
  const fidx = list.findIndex(p => p.slug === slug);
  const prev = fidx > 0 ? list[fidx - 1] : null;
  const next = fidx < list.length - 1 ? list[fidx + 1] : null;
  const rt = post.readingTime || 1;

  let navHtml = '';
  if (prev || next) {
    navHtml = '<div class="detail-nav">';
    if (prev) navHtml += `<a href="#/post/${prev.slug}" class="nav-prev" data-nav-slug="${prev.slug}">&larr; ${prev.title}</a>`;
    else navHtml += '<span></span>';
    if (next) navHtml += `<a href="#/post/${next.slug}" class="nav-next" data-nav-slug="${next.slug}">${next.title} &rarr;</a>`;
    navHtml += '</div>';
  }

  modalBody.innerHTML = `
    <div class="detail-seal">
      <span class="seal-stamp">文</span>
      <span class="seal-text">ESSAY / ${d.month.toUpperCase()}</span>
    </div>
    <h1 class="detail-title">${post.title}</h1>
    <div class="detail-meta">${d.full} &middot; 阅读约 ${rt} 分钟</div>
    <div class="detail-body" id="detailBody">${post.content}</div>
    ${navHtml}
  `;

  openPostDOM();
}

/* ---- 旧版兼容 —— openPost(id) 转为 slug 查找 ---- */
function openPost(id) {
  const post = posts.find(p => p.id === id);
  if (post) openPostBySlug(post.slug);
}

function openPostDOM() {
  const bodyEl = document.getElementById('detailBody');
  if (!bodyEl) return;

  // 为代码块添加语言类（Prism 需要）
  bodyEl.querySelectorAll('pre code:not([class*="language-"])').forEach(el => {
    const txt = el.textContent;
    let lang = 'javascript';
    if (/"(?:service|method|id|name)"/.test(txt)) lang = 'json';
    else if (/container-type|@container|display:\s*flex/.test(txt)) lang = 'css';
    else if (/^import\s|^export\s/.test(txt)) lang = 'typescript';
    else if (/^#include|int\s+\w+\s*\(/.test(txt)) lang = 'c';
    else if (/^def\s+|^import\s+\w+/.test(txt)) lang = 'python';
    else if (/^<\w+/.test(txt.trim())) lang = 'html';
    el.className = 'language-' + lang;
  });

  // 构建目录
  const tocHtml = buildTOC(bodyEl);
  if (tocHtml) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = tocHtml;
    const metaEl = modalBody.querySelector('.detail-meta');
    if (metaEl) metaEl.after(wrapper);

    const tocBtn = wrapper.querySelector('#tocToggle');
    const tocPanel = wrapper.querySelector('#tocPanel');
    if (tocBtn && tocPanel) {
      tocBtn.addEventListener('click', () => {
        tocBtn.classList.toggle('open');
        tocPanel.classList.toggle('open');
      });
    }
    wrapper.querySelectorAll('.detail-toc a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const tgt = document.getElementById(a.getAttribute('href').slice(1));
        if (tgt) tgt.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  if (window.Prism) {
    Prism.highlightAllUnder(modalBody);
  }

  // 社交分享按钮
  const shareSlug = state.currentSlug;
  const shareTitle = encodeURIComponent(document.title);
  const shareUrl = encodeURIComponent('https://susurrune.github.io/blog/#/post/' + shareSlug);
  const shareBar = document.createElement('div');
  shareBar.className = 'share-bar';
  shareBar.innerHTML = `
    <span class="share-label">分享</span>
    <button class="share-btn copy-link" title="复制链接">🔗 复制链接</button>
    <button class="share-btn share-twitter" title="分享到 Twitter/X">𝕏 Tweet</button>
    <button class="share-btn share-native" title="原生分享">📤 分享</button>
  `;
  // 插入到正文之后、导航之前
  const detailBody = modalBody.querySelector('#detailBody');
  if (detailBody) detailBody.after(shareBar);

  shareBar.querySelector('.copy-link').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText('https://susurrune.github.io/blog/#/post/' + shareSlug);
      const btn = shareBar.querySelector('.copy-link');
      btn.textContent = '✅ 已复制';
      setTimeout(() => { btn.textContent = '🔗 复制链接'; }, 2000);
    } catch {
      prompt('复制以下链接：', 'https://susurrune.github.io/blog/#/post/' + shareSlug);
    }
  });
  shareBar.querySelector('.share-twitter').addEventListener('click', () => {
    window.open('https://twitter.com/intent/tweet?text=' + shareTitle + '&url=' + shareUrl, '_blank', 'width=600,height=400');
  });
  shareBar.querySelector('.share-native').addEventListener('click', () => {
    if (navigator.share) {
      navigator.share({ title: document.title, url: 'https://susurrune.github.io/blog/#/post/' + shareSlug });
    } else {
      prompt('复制以下链接分享：', 'https://susurrune.github.io/blog/#/post/' + shareSlug);
    }
  });

  // Giscus 评论区
  const commentsWrap = document.createElement('div');
  commentsWrap.className = 'comments-section';
  commentsWrap.id = 'giscusContainer';
  commentsWrap.innerHTML = '<div id="giscus"></div>';
  shareBar.after(commentsWrap);
  loadComments(shareSlug);

  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalContent.scrollTop = 0;
  progressBar.style.width = '0';

  requestAnimationFrame(() => {
    modalBody.querySelectorAll('[data-nav-slug]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        openPostBySlug(a.dataset.navSlug);
      });
    });
  });
}

/* ---- Giscus 评论 ---- */
function loadComments(slug) {
  const giscus = document.getElementById('giscus');
  if (!giscus) return;
  // 清空旧脚本
  giscus.innerHTML = '';
  const script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.setAttribute('data-repo', 'susurrune/blog');
  script.setAttribute('data-repo-id', 'R_kgDO_NOT_SET');     // ⚠️ 需替换为你的仓库 ID
  script.setAttribute('data-category', 'Announcements');       // ⚠️ 需替换为你的分类
  script.setAttribute('data-category-id', 'DIC_kwDO_NOT_SET'); // ⚠️ 需替换为你的分类 ID
  script.setAttribute('data-mapping', 'specific');
  script.setAttribute('data-term', slug);
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  script.setAttribute('data-lang', 'zh-CN');
  script.setAttribute('crossorigin', 'anonymous');
  script.async = true;
  giscus.appendChild(script);
}

/* ---- 关闭模态框 ---- */
function closeModal() {
  state.currentSlug = null;
  routeTo(null);
  document.title = '雨落 · 代码与笔墨';

  // 重置 SEO 标签为首页默认值
  const homeUrl = 'https://susurrune.github.io/blog/';
  updateMeta('og:title', '雨落 · 代码与笔墨');
  updateMeta('og:description', '关于编程、架构与思考的笔记');
  updateMeta('og:url', homeUrl);
  updateMeta('og:type', 'website');
  updateMeta('twitter:title', '雨落 · 代码与笔墨');
  updateMeta('twitter:description', '关于编程、架构与思考的笔记');
  updateMeta('description', '雨落（Rain Drop）— 关于编程、架构与思考的笔记。写代码，写世界。');
  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.href = homeUrl;

  modalContent.classList.add('modal-out');
  setTimeout(() => {
    modalOverlay.classList.remove('open');
    modalContent.classList.remove('modal-out');
    document.body.style.overflow = '';
    progressBar.classList.remove('visible');
    progressBar.style.width = '0';
  }, 200);
}

/* ---- 主题 ---- */
function initTheme() {
  const s = localStorage.getItem('blog-theme') || 'light';
  document.documentElement.setAttribute('data-theme', s);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('blog-theme', next);
}

/* ---- 搜索 ---- */
function initSearch() {
  let t;
  searchInput.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      state.searchQuery = searchInput.value;
      if (state.searchQuery) { state.currentTag = null; renderTags(); }
      filterPosts();
      updateNavActive();
    }, 200);
  });
}

/* ---- 阅读进度条 ---- */
function initProgress() {
  modalContent.addEventListener('scroll', () => {
    const st = modalContent.scrollTop;
    const sh = modalContent.scrollHeight - modalContent.clientHeight;
    if (sh <= 0) return;
    const pct = Math.min(st / sh * 100, 100);
    if (pct > 1) { progressBar.classList.add('visible'); progressBar.style.width = pct + '%'; }
    else { progressBar.classList.remove('visible'); progressBar.style.width = '0'; }
  });
}

/* ---- 回到顶部 ---- */
function initBackToTop() {
  const circumference = 2 * Math.PI * 20;
  topProgress.style.strokeDasharray = circumference;
  topProgress.style.strokeDashoffset = '0';

  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    backToTop.classList.toggle('visible', scrollTop > 400);
    if (docHeight > 0) {
      const pct = scrollTop / docHeight;
      topProgress.style.strokeDashoffset = (circumference * (1 - pct)).toString();
    }
  }, { passive: true });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ---- 键盘 ---- */
function initKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
  });
}

/* ---- 导航 ---- */
function initNav() {
  document.querySelectorAll('.nav a[data-tag]').forEach(a => {
    a.addEventListener('click', () => {
      state.currentTag = a.dataset.tag;
      state.searchQuery = ''; searchInput.value = '';
      renderTags(); filterPosts(); updateNavActive();
    });
  });
  document.querySelector('.nav a[href="./"]').addEventListener('click', e => {
    e.preventDefault();
    state.currentTag = null; state.searchQuery = ''; searchInput.value = '';
    renderTags(); filterPosts(); updateNavActive();
  });
}

/* ---- 头部滚动阴影 ---- */
function initScrollHeader() {
  window.addEventListener('scroll', () => {
    siteHeader.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });
}

/* ---- 启动 ---- */
function init() {
  initTheme();
  renderTags();
  filterPosts();
  initSearch();
  initKeyboard();
  initNav();
  initScrollHeader();
  initProgress();
  initBackToTop();
  modalClose.addEventListener('click', closeModal);
  modalScrim.addEventListener('click', closeModal);
  themeBtn.addEventListener('click', toggleTheme);

  // 路由：监听浏览器前进/后退
  window.addEventListener('hashchange', handleRoute);

  // 启动时检查深层链接（新标签页打开时自动展开文章）
  if (window.location.hash) {
    handleRoute();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
